services:
  hdhomerun-dvr:
    # Option 1: Use pre-built image from GHCR
    # For production, consider pinning to a specific version tag instead of :latest
    image: ghcr.io/ryandanthony/hd-homerun-dvr:latest
    
    # Option 2: Build locally (comment out 'image' above and uncomment below)
    # build: .
    # image: hdhomerun-dvr:latest
    
    container_name: hdhomerun-dvr
    network_mode: host
    volumes:
      # Mount local directory for recordings
      - ./recordings:/var/lib/hdhomerun/recordings
      # Optional: mount configuration directory
      - ./config:/etc/hdhomerun
    restart: unless-stopped
    environment:
      # Add any environment variables if needed
      - TZ=America/New_York
